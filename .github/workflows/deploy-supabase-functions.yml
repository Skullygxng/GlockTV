name: Deploy Supabase Edge Functions

# Deploys only the billing functions, and only from main. PR validation never
# runs this workflow, so a pull request cannot reach production.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

# Read-only against the repository. The deployment credential is a secret, not
# a workflow permission.
permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Without this the run fails several steps later inside the CLI, as
      # "Access token not provided", which reads like a broken workflow rather
      # than an unconfigured repository. Name the missing secrets up front.
      - name: Require deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "The billing Edge Functions cannot deploy until these are set in"
            echo "Settings > Secrets and variables > Actions. See README, 'Setup"
            echo "still required before checkout works'."
            exit 1
          fi
          echo "Deployment secrets present."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Which secrets the project holds, before anything is deployed. `secrets
      # list` prints names and digests only - never a value - so this is safe in
      # a public log, and it turns "Premium is not configured yet" from a 500
      # discovered later into a named gap reported here. It does not gate the
      # deploy: the functions are deployable without Stripe configured, they
      # simply refuse to act until it is.
      - name: Report configured function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets list --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # Named explicitly rather than deploying everything under functions/, so
      # a new directory cannot reach production without a deliberate change here.
      - name: Deploy billing functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy create-checkout \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy create-billing-portal \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy stripe-webhook \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
