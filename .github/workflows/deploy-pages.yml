name: Deploy GlockTV to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard production file integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checks = {
            'src/App.tsx': {
              'minimum': 30000,
              'sentinels': ['FriendsRoute', 'MediaCard', 'PlaybackModal', 'loadDiscovery', 'openContext', 'export function App'],
            },
            'src/components/FriendsExperience.tsx': {
              'minimum': 36000,
              'sentinels': ['createRoom', 'joinRoom', 'sendMessage', 'subscribe', 'clearChat', 'PartyPlaybackPlayer', 'export function FriendsExperience'],
            },
            'src/friends.css': {
              'minimum': 8000,
              'sentinels': ['.watch-party', '.friends-lobby'],
            },
            'tests/friends-watch-party.test.tsx': {
              'minimum': 25000,
              'sentinels': ['Create private room', 'Join invite', 'Stay in room', 'Resume hosting', 'Jump to latest message', 'Room controls', 'Message the room'],
            },
          }

          for path, spec in checks.items():
              file = Path(path)
              size = file.stat().st_size
              text = file.read_text(encoding='utf-8', errors='replace')
              if size < spec['minimum']:
                  raise SystemExit(f'{path} is {size} bytes; expected at least {spec["minimum"]}')
              if 'PLACEHOLDER_' in text or text.strip() in {'PLACEHOLDER_APP', 'PLACEHOLDER_FRIENDS', 'PLACEHOLDER_CSS', 'PLACEHOLDER_TEST'}:
                  raise SystemExit(f'{path} still contains a placeholder overwrite')
              missing = [token for token in spec['sentinels'] if token not in text]
              if missing:
                  raise SystemExit(f'{path} is missing production sentinels: {', '.join(missing)}')
              print(f'{path}: {size} bytes, sentinels ok')
          print('integrity ok')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          VITE_PARTY_MOVIE_EMBED_URL_TEMPLATE: 'https://vidzen.fun/movie/{tmdb_id}'
          VITE_PARTY_TV_EMBED_URL_TEMPLATE: 'https://vidzen.fun/tv/{tmdb_id}/{season_number}/{episode_number}'
          VITE_PARTY_BACKUP_MOVIE_EMBED_URL_TEMPLATE: 'https://www.vidcore.org/embed/movie/{tmdb_id}?autoPlay=true&theme=8B24ED&fullscreenButton=true&title=false'
          VITE_PARTY_BACKUP_TV_EMBED_URL_TEMPLATE: 'https://www.vidcore.org/embed/tv/{tmdb_id}/{season_number}/{episode_number}?autoPlay=true&theme=8B24ED&fullscreenButton=true&title=false'
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_MOVIE_EMBED_URL_TEMPLATE: 'https://www.vidcore.org/embed/movie/{tmdb_id}?autoPlay=true&theme=8B24ED&fullscreenButton=true&title=false'
          VITE_TV_EMBED_URL_TEMPLATE: 'https://www.vidcore.org/embed/tv/{tmdb_id}/{season_number}/{episode_number}?autoPlay=true&theme=8B24ED&fullscreenButton=true&title=false'
          VITE_BACKUP_MOVIE_EMBED_URL_TEMPLATE: 'https://vidzen.fun/movie/{tmdb_id}'
          VITE_BACKUP_TV_EMBED_URL_TEMPLATE: 'https://vidzen.fun/tv/{tmdb_id}/{season_number}/{episode_number}'
          VITE_CINESRC_MOVIE_EMBED_URL_TEMPLATE: 'https://cinesrc.st/embed/movie/{tmdb_id}?autoplay=true&color=%238b24ed&prioritize=true&continueprompt=false'
          VITE_CINESRC_TV_EMBED_URL_TEMPLATE: 'https://cinesrc.st/embed/tv/{tmdb_id}?s={season_number}&e={episode_number}&autoplay=true&color=%238b24ed&prioritize=true&continueprompt=false'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
