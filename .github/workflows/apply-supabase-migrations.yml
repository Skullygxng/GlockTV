name: Apply Supabase migrations

# Applying migrations changes a live database, so this never runs on a push.
# It is dispatched deliberately, and it defaults to a dry run: the first thing
# you get is the list of migrations the project is missing, not a mutation.
#
# Determinism comes from the CLI, not from this file - `supabase db push`
# applies the files under supabase/migrations in filename order and skips the
# ones the project's migration history already records, so running it twice
# applies nothing the second time.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List the pending migrations without applying them'
        type: boolean
        default: true
      repair_versions:
        description: >-
          Space-separated migration versions to mark as already applied.
          History only - writes no schema and no data. Leave empty to audit.
        type: string
        default: ''

permissions:
  contents: read

# Two runs against one database would interleave DDL. Queue them instead.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require database secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "See README, 'Setup still required before checkout works'."
            exit 1
          fi
          echo "Database secrets present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # What the project's history actually records. `db push --dry-run` says
      # which local versions are missing from it but never why, and the two
      # have very different answers: a version absent because the change was
      # never made needs pushing, while one absent because the change was made
      # by hand needs its history repairing instead.
      - name: Audit migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list

      # Read-only, and the decisive half: whether the objects each migration
      # creates already exist. Every statement it sends is a SELECT.
      - name: Audit local migrations against the live schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/audit-supabase-migrations.mjs

      # Opt-in, and history-only: `migration repair` writes rows into
      # supabase_migrations.schema_migrations and touches no schema and no
      # data. It runs on a dry run too, because repairing and then re-checking
      # the push is the whole point of doing it.
      - name: Repair migration history
        if: ${{ inputs.repair_versions != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REPAIR_VERSIONS: ${{ inputs.repair_versions }}
        run: |
          # Read through the environment and validated, never interpolated into
          # the command line: this input reaches a shell.
          for version in $REPAIR_VERSIONS; do
            case "$version" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
              *) echo "::error::Not a migration version: $version"; exit 1 ;;
            esac
          done
          echo "Marking as applied: $REPAIR_VERSIONS"
          # shellcheck disable=SC2086
          supabase migration repair --status applied $REPAIR_VERSIONS

      - name: Re-audit after repair
        if: ${{ inputs.repair_versions != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list

      # Always printed, including on a real run, so the log records what was
      # about to change before it changed.
      - name: List pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Apply migrations
        if: ${{ inputs.dry_run == false }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
