name: Verify authorized embed endpoints

# Manual only. Proves that every URL shape in PPV_AUTHORIZED_EMBED_HOSTS is a
# real, serving endpoint on the platform's own origin - the container this was
# developed in has no egress to these hosts, so the check has to run somewhere
# that does.
#
# What a 200 here does and does not mean: it means the platform's player page
# exists and serves. It does NOT mean a given broadcast is embeddable - a
# rights holder can disable embedding per video, and that is decided inside a
# cross-origin frame we cannot see into.

on:
  workflow_dispatch:
  # workflow_dispatch alone is not dispatchable until the file reaches the
  # default branch, so the branch this was developed on triggers it directly.
  push:
    branches: [claude/hello-rluoto]
    paths: ['.github/workflows/verify-authorized-embeds.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe each authorized embed endpoint
        run: |
          set -u
          fail=0
          probe() {
            url="$1"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 \
              -A 'Mozilla/5.0 (compatible; GlockTV-embed-check)' "$url" || echo 000)
            printf '%-6s %s\n' "$code" "$url"
            case "$code" in
              2*|3*) ;;
              *) fail=1 ;;
            esac
          }
          probe 'https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?rel=0'
          probe 'https://player.twitch.tv/?channel=twitch&parent=skullygxng.github.io&autoplay=false'
          probe 'https://player.kick.com/xqc'
          # Rumble needs its real embed id, which is NOT the watch-page slug -
          # the same distinction rumbleVideoIdFrom refuses to guess across. Ask
          # Rumble's own oEmbed API for the embed it emits, then probe that and
          # check our builder produces the same shape.
          oembed=$(curl -sS -m 30 -A 'Mozilla/5.0 (compatible; GlockTV-embed-check)' \
            'https://wn0.rumble.com/api/Media/oembed.json?url=https://rumble.com/v1a59rb-rumble-basics-how-to-embed-your-video.html' \
            || echo '')
          rumble_src=$(printf '%s' "$oembed" | grep -oE 'https://rumble\.com/embed/[A-Za-z0-9.]+/?' | head -1)
          if [ -z "$rumble_src" ]; then
            echo 'Rumble oEmbed returned no embed URL; cannot verify the endpoint.'
            fail=1
          else
            echo "Rumble oEmbed emitted: $rumble_src"
            probe "$rumble_src"
          fi
          probe 'https://player.vimeo.com/video/76979871'
          echo
          if [ "$fail" -ne 0 ]; then
            echo 'At least one authorized embed endpoint did not serve.'
            exit 1
          fi
          echo 'All authorized embed endpoints served.'
